<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q9 - Form Submit Blocker</title>
  <link rel="stylesheet" href="style.css">
  <script src="q9.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Form Submit Blocker & Live Errors</h1>
    <form id="validationForm" novalidate>
      <div class="field">
        <label for="name">Name (required)</label>
        <input id="name" type="text" placeholder="Enter your name">
        <p id="nameError" class="error"></p>
      </div>
      <div class="field">
        <label for="email">Email (required, must contain @)</label>
        <input id="email" type="text" placeholder="Enter your email">
        <p id="emailError" class="error"></p>
      </div>
      <div class="field">
        <label for="password">Password (minimum 6 characters)</label>
        <input id="password" type="password" placeholder="Enter password">
        <p id="passwordError" class="error"></p>
      </div>
      <button type="submit">Submit Form</button>
    </form>
    <p id="submitMessage" class="message" aria-live="polite"></p>
  </main>
</body>
</html>
