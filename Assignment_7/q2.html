<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q2 - Live Character Counter</title>
  <link rel="stylesheet" href="style.css">
  <script src="q2.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Live Character Counter</h1>
    <label for="messageInput">Write a message (maximum 100 characters)</label>
    <textarea id="messageInput" maxlength="100" placeholder="Start typing..."></textarea>
    <p id="characterCounter" class="counter" aria-live="polite">100 characters remaining</p>
    <button id="resetButton" type="button" class="secondary">Reset</button>
  </main>
</body>
</html>
