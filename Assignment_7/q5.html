<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q5 - Image Gallery</title>
  <link rel="stylesheet" href="style.css">
  <script src="q5.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Image Gallery with Modal Preview</h1>
    <p>Click any image to view a larger preview. Click the dark area outside the image to close.</p>
    <div class="gallery" id="imageGallery">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=500" alt="Mountain landscape">
      <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=500" alt="Lake and mountains">
      <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500" alt="Sunlight in a forest">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500" alt="Beach and ocean">
      <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=500" alt="Sunrise over hills">
      <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=500" alt="Nature landscape">
    </div>
    <div id="imageModal" class="modal" aria-hidden="true">
      <div id="modalContent" class="modal-content">
        <img id="largeImage" src="" alt="Large gallery preview">
      </div>
    </div>
  </main>
</body>
</html>
