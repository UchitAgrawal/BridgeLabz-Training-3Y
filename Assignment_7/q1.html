<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q1 - Dynamic Product List Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="q1.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Dynamic Product List Manager</h1>
    <form id="productForm" class="row">
      <input id="productInput" type="text" placeholder="Enter product name" aria-label="Product name" required>
      <button type="submit">Add Product</button>
    </form>
    <p>Use Edit to change a product. Clicking elsewhere saves an active edit.</p>
    <ul id="productList"></ul>
  </main>
</body>
</html>
