<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q4 - Theme Switcher</title>
  <link rel="stylesheet" href="style.css">
  <script src="q4.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Theme Switcher</h1>
    <p>Choose a theme. The selected theme is stored in the body's data-theme attribute.</p>
    <div class="theme-buttons">
      <button type="button" data-theme-choice="light">Light</button>
      <button type="button" data-theme-choice="dark">Dark</button>
      <button type="button" data-theme-choice="blue">Blue</button>
    </div>
    <p id="themeStatus" class="result" aria-live="polite"></p>
  </main>
</body>
</html>
