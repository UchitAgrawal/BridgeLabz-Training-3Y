<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q7 - Mouse Path Logger</title>
  <link rel="stylesheet" href="style.css">
  <script src="q7.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Mouse Coordinates Logger</h1>
    <p>Move the mouse inside the 400 × 400 box. Double-click to place a red dot.</p>
    <div id="mouseBox" aria-label="Mouse tracking area"></div>
    <p id="coordinates" class="result" aria-live="polite">clientX: —, clientY: —</p>
  </main>
</body>
</html>
