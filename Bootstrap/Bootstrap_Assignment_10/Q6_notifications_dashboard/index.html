<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notifications Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><header class="navbar bg-white border-bottom"><div class="container"><span class="navbar-brand fw-bold">Pulse Dashboard</span><span class="text-secondary">Notifications</span></div></header><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><div class="card shadow-sm"><div class="card-header bg-dark text-white"><h1 class="h4 mb-0">Your updates</h1></div><div class="card-body"><div class="alert alert-success" role="alert"><strong>Success:</strong> Your weekly report is ready.</div><div class="alert alert-info" role="alert"><strong>Tip:</strong> Add a due date to keep tasks on track.</div><div class="alert alert-danger alert-dismissible fade show" role="alert"><strong>Warning:</strong> Your profile is missing a recovery email.<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button></div><section class="summary-well bg-light border rounded p-4 mt-4"><h2 class="h5">Summary</h2><div class="row text-center"><div class="col-4"><strong class="fs-3">12</strong><p class="mb-0">Tasks</p></div><div class="col-4"><strong class="fs-3">4</strong><p class="mb-0">Messages</p></div><div class="col-4"><strong class="fs-3">2</strong><p class="mb-0">Warnings</p></div></div></section></div></div></div></div></main><footer class="text-center text-secondary py-4">Pulse · Notification center</footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
