<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Task Tracker</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><header class="bg-primary text-white py-4"><div class="container d-flex justify-content-between align-items-center"><h1 class="h3 mb-0">Task Board</h1><span>Pending <span class="badge text-bg-light text-primary">3</span></span></div></header><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><h2 class="h4 mb-3">My tasks</h2><ul class="list-group shadow-sm"><li class="list-group-item d-flex justify-content-between align-items-center"><span>Finish project proposal</span><span class="badge text-bg-danger">High</span></li><li class="list-group-item d-flex justify-content-between align-items-center"><span>Review sprint notes</span><span class="badge text-bg-warning">Medium</span></li><li class="list-group-item d-flex justify-content-between align-items-center"><span>Organize reference files</span><span class="badge text-bg-success">Low</span></li></ul><div class="d-flex justify-content-end mt-4"><button class="btn btn-success" type="button">Completed <span class="badge text-bg-light text-success ms-1">5</span></button></div><p class="text-secondary mt-3">Priority badges help identify the next task to focus on.</p></div></div></main><footer class="bg-light text-center py-3">Stay focused. Make progress.</footer></body></html>
