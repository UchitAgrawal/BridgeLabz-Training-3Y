<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q3 - Library Management</title>
  <link rel="stylesheet" href="style.css">
  <script src="q3.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Library Management System</h1>
    <h2>Available Books</h2>
    <div id="bookList" class="result"></div>
    <form id="issueForm">
      <label for="isbn">Enter ISBN to issue a book</label>
      <input id="isbn" type="text" placeholder="Enter ISBN">
      <button type="submit">Issue Book</button>
    </form>
    <p id="libraryMessage" class="message" aria-live="polite"></p>
  </main>
</body>
</html>
