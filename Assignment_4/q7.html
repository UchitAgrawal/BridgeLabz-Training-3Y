<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q7 - Login Validation</title>
  <link rel="stylesheet" href="style.css">
  <script src="q7.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Login Form</h1>
    <form id="loginForm" novalidate>
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="At least 5 characters">
      <p id="usernameError" class="error"></p>

      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" placeholder="Enter password">
      <p id="loginPasswordError" class="error"></p>

      <button type="submit">Login</button>
    </form>
    <p id="loginMessage" class="message" aria-live="polite"></p>
  </main>
</body>
</html>
