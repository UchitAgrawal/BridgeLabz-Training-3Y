<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q9 - Shopping Cart</title>
  <link rel="stylesheet" href="style.css">
  <script src="q9.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Shopping Cart</h1>
    <form id="cartForm">
      <label for="itemName">Item name</label>
      <input id="itemName" type="text" placeholder="Product name" required>
      <label for="itemPrice">Price (₹)</label>
      <input id="itemPrice" type="number" min="0.01" step="0.01" required>
      <label for="itemQuantity">Quantity</label>
      <input id="itemQuantity" type="number" min="1" step="1" value="1" required>
      <button type="submit">Add Item</button>
    </form>

    <h2>Cart Items</h2>
    <pre id="cartItems" class="result">Your cart is empty.</pre>
    <p id="cartTotal" class="message">Subtotal: ₹0.00</p>

    <label for="coupon">Coupon code</label>
    <input id="coupon" type="text" placeholder="Example: SAVE20 or DISC10">
    <button id="applyCoupon" type="button">Apply Coupon</button>
    <p id="couponMessage" class="message" aria-live="polite"></p>
    <p id="finalTotal" class="message">Final total: ₹0.00</p>
  </main>
</body>
</html>
